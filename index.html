<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe6d4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BCA I">
<title>BCA I Timetable</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23b3202a'/%3E%3Ctext x='50' y='66' font-size='46' font-weight='700' text-anchor='middle' fill='%23efe6d4' font-family='sans-serif'%3EBCA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;--bg:#efe6d4;--red:#b3202a;--on:#efe6d4;--line:rgba(179,32,42,.28)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--red);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:28px 20px 40px}
h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:3.4rem;line-height:1;margin:0;letter-spacing:-.04em}
#sub{margin:8px 0 26px;font-weight:500;opacity:.8}
.tabs{display:flex;border-top:1.5px solid var(--red);border-bottom:1.5px solid var(--red);margin-bottom:22px}
.tabs button{flex:1;border:0;background:none;color:var(--red);font:700 .9rem 'DM Sans',sans-serif;padding:13px 0;cursor:pointer;position:relative}
.tabs button[aria-selected=true]{background:var(--red);color:var(--on)}
.tabs button.today:not([aria-selected=true])::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--red)}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h2{font-family:'Bricolage Grotesque',sans-serif;font-size:1.5rem;margin:0 0 6px;display:flex;align-items:baseline;gap:10px}
h2 small{font:500 .85rem 'DM Sans',sans-serif;opacity:.75}
.p{display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.n{font:800 1.1rem 'Bricolage Grotesque',sans-serif;width:2.2rem;flex:none;opacity:.7}
.s{font:700 1.5rem 'Bricolage Grotesque',sans-serif;letter-spacing:-.01em}
.t{margin-left:auto;font-size:.78rem;font-weight:700;border:1.5px solid var(--red);padding:3px 11px;border-radius:99px}
.grid{margin-top:34px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:340px;text-align:center;font-size:.85rem}
th{font-weight:700;padding:8px 4px;border-bottom:1.5px solid var(--red)}
td{padding:6px 2px;border-bottom:1px solid var(--line)}
td:first-child{font-weight:700;text-align:left}
.chip{display:block;padding:7px 2px;font-weight:600}
.chip.lab{background:var(--red);color:var(--on);border-radius:6px;font-weight:700}
tr.now td:first-child::before{content:"\25CF\00a0";font-size:.6rem;vertical-align:middle}
.foot{margin-top:22px;opacity:.7;font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
<h1>BCA I</h1><p id="sub">Class timetable</p>
<div class="tabs" id="tabs" role="tablist"></div>
<section id="day" aria-live="polite"></section>
<section class="grid"><h2>Full week</h2><div class="tbl"><table id="tbl"></table></div></section>
<p class="foot">Periods I to V</p>
</div>
<script>
var D=["Monday","Tuesday","Wednesday","Thursday","Friday"];
var R=["I","II","III","IV","V"];
var T={
Monday:["Maths","C","DF","C","Cyber"],
Tuesday:["H/M","English","Maths","C (L)","Cyber"],
Wednesday:["C","C (L)","English","Maths","DF"],
Thursday:["H/M","English","DF","Cyber","C"],
Friday:["C (L)","C (L)","Maths","DF","H/M"]};
function nm(s){return s==="C (L)"?"C":s}
var g=new Date().getDay(),ti=(g>=1&&g<=5)?g-1:-1,sel=ti<0?0:ti;
var tabs=document.getElementById("tabs");
D.forEach(function(d,i){var b=document.createElement("button");b.textContent=d.slice(0,3);b.setAttribute("role","tab");b.onclick=function(){sel=i;draw()};if(i===ti)b.className="today";tabs.appendChild(b)});
function draw(){
 [].forEach.call(tabs.children,function(b,i){b.setAttribute("aria-selected",i===sel)});
 var d=D[sel],h='<h2>'+d+'<small>'+(sel===ti?"Today":(ti<0&&sel===0?"Next class day":""))+'</small></h2>';
 T[d].forEach(function(s,i){
  h+='<div class="p"><span class="n">'+R[i]+'</span><span class="s">'+nm(s)+'</span>'+(s==="C (L)"?'<span class="t">Lab</span>':'')+'</div>'});
 document.getElementById("day").innerHTML=h;
 document.getElementById("sub").textContent=ti<0?"Weekend: showing Monday":"Class timetable";
}
var t='<tr><th></th>'+R.map(function(r){return"<th>"+r+"</th>"}).join("")+'</tr>';
D.forEach(function(d,i){t+='<tr'+(i===ti?' class="now"':'')+'><td>'+d.slice(0,3)+'</td>'+T[d].map(function(s){var l=s==="C (L)";return'<td><span class="chip'+(l?' lab':'')+'">'+(l?"C Lab":s)+'</span></td>'}).join("")+'</tr>'});
document.getElementById("tbl").innerHTML=t;
draw();
</script>
</body>
</html>
